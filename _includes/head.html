<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | prepend: site.url}}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  {% assign share_image = page.image | default: "/images/dsecop-card.jpg" %}
  <meta property="og:site_name" content="DSECOP">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="Data Science Education Community of Practice: bringing data science into the undergraduate physics curriculum.">
  <meta property="og:url" content="https://dsecop.org{{ page.url | replace:'index.html','' }}">
  <meta property="og:image" content="https://dsecop.org{{ share_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="DSECOP: Data Science Education Community of Practice">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://dsecop.org{{ share_image }}">
  <link rel="shortcut icon" type ="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/images/favicon.ico">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" type="text/css">
  
{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

</head>
